name: Dead Code Detection

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  dead-code-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run TypeScript type checking
      run: pnpm typecheck

    - name: Run ESLint (includes dead code detection rules)
      run: pnpm lint

    - name: Run dead code detection
      id: dead_code
      run: pnpm run check:dead-code

    - name: Comment on PR (if unused exports detected)
      if: github.event_name == 'pull_request' && failure() && steps.dead_code.outcome == 'failure'
      uses: actions/github-script@v7
      with:
        script: |
          const issue_number = context.issue.number;
          const body = `
          ## ⚠️ Dead Code Detection Alert

          This PR introduces new unused exports.

          **Action Required:**
          - Check the logs above for details
          - Remove the unused exports

          **Tools Used:**
          - \`ts-unused-exports\` for unused export detection
          - ESLint rules for basic dead code patterns
          `;

          github.rest.issues.createComment({
            issue_number: issue_number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });