name: Publish to NPM

on:
  release:
    types: [published]
  # Re-runs a release whose publish failed, since a re-run of the release event uses the tagged workflow file.
  workflow_dispatch:

# npm trusted publishing exchanges this OIDC token for a one-time publish credential, so no npm token or OTP is needed.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships npm 10.
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Run tests (CI mode - skip live integration tests)
        run: pnpm test:ci
        env:
          SKIP_INTEGRATION_TESTS: true
          MOCK_ONLY_TESTS: true
          NAVIDROME_URL: http://ci-dummy-server:4533
          NAVIDROME_USERNAME: ci-dummy-user
          NAVIDROME_PASSWORD: ci-dummy-password
          DEBUG: false

      - name: Run lint and typecheck
        run: pnpm lint && pnpm typecheck

      # npm documents trusted publishing for its own CLI, so this step uses npm instead of pnpm.
      - name: Publish to NPM
        run: npm publish
